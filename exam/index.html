<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealDB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#" id="home-link">
                🍽 Meal Explorer
            </a>

            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light me-2" id="btn-random" title="Випадкова страва">🎲</button>
                <button class="btn btn-outline-warning me-3" id="btn-favorites">⭐ Обрані</button>

                <form class="d-flex" id="search-form">
                    <input
                        id="search-input"
                        class="form-control me-2"
                        type="search"
                        placeholder="Пошук страви">
                    <button class="btn btn-warning" type="submit">
                        Знайти
                    </button>
                </form>
            </div>
        </div>
    </nav>

        <section class="bg-light py-5" id="hero-section">
        <div class="container text-center">
            <h1>Каталог рецептів</h1>
            <p class="lead">
                Знайди улюблену страву та переглянь рецепт
            </p>
        </div>
    </section>

        <section class="container py-5" id="categories-section">
        <h2 class="mb-4">Категорії</h2>
        <div class="row g-3" id="categories-container">
            <p>Завантаження категорій...</p>
        </div>
    </section>

        <section class="container pb-5" id="meals-section">
        <h2 class="mb-4" id="meals-title">Популярні страви</h2>
        <div class="row g-4" id="meals-container">
            <p>Завантаження страв...</p>
        </div>
    </section>

    <div class="modal fade" id="mealModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="mealModalTitle">Назва страви</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="text-center">
                        <img src="" id="mealModalImg" class="img-fluid rounded mb-3 shadow" alt="Meal" style="max-height: 400px; object-fit: cover;">
                    </div>
                    
                    <h4>Інгредієнти</h4>
                    <ul id="mealModalIngredients" class="mb-4"></ul>

                    <h4>Інструкція</h4>
                    <p id="mealModalInstructions" style="white-space: pre-line;"></p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger" id="modalFavBtn">
                        Додати в обране
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Закрити
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="./app.js"></script>

</body>
</html>
