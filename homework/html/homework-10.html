<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сучасна HTML форма</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        color: white;
        transition: background 0.3s, color 0.3s;
      }

      .form-card {
        width: 100%;
        max-width: 700px;
        background: #111827;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        transition: background 0.3s, box-shadow 0.3s;
      }

      .settings-panel {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #334155;
        transition: border-color 0.3s;
      }

      .setting-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .setting-item select {
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .form-card h1 {
        margin-bottom: 10px;
        font-size: 32px;
      }

      .form-card p {
        color: #94a3b8;
        margin-bottom: 30px;
        transition: color 0.3s;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .full {
        grid-column: 1 / -1;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        color: #cbd5e1;
        transition: color 0.3s;
      }

      input,
      textarea,
      select {
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #1e293b;
        color: white;
        outline: none;
        transition: 0.3s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        box-shadow: 0 0 0 3px #3b82f6;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .radio-group,
      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 5px;
      }

      .radio-group label,
      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1e293b;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .range-value {
        margin-top: 10px;
        color: #38bdf8;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }

      button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .submit-btn {
        background: #2563eb;
        color: white;
      }

      .submit-btn:hover {
        background: #1d4ed8;
      }

      .reset-btn {
        background: #334155;
        color: white;
      }

      .reset-btn:hover {
        background: #475569;
      }

      body.light-theme {
        background: linear-gradient(135deg, #f8fafc, #e2e8f0);
        color: #0f172a;
      }
      .light-theme .form-card {
        background: #ffffff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      }
      .light-theme .settings-panel {
        border-bottom: 1px solid #e2e8f0;
      }
      .light-theme .form-card p {
        color: #64748b;
      }
      .light-theme label {
        color: #475569;
      }
      .light-theme input,
      .light-theme textarea,
      .light-theme select {
        background: #f1f5f9;
        color: #0f172a;
      }
      .light-theme .radio-group label,
      .light-theme .checkbox-group label {
        background: #f1f5f9;
      }
      .light-theme .reset-btn {
        background: #cbd5e1;
        color: #0f172a;
      }
      .light-theme .reset-btn:hover {
        background: #94a3b8;
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .settings-panel {
          flex-direction: column;
          align-items: flex-end;
          gap: 10px;
        }
      }
    </style>
    <script defer src="../scripts/homework-10.js"></script>
  </head>
  <body>
    <div class="form-card">
      <div class="settings-panel">
        <div class="setting-item">
          <label data-i18n="theme_label">Тема:</label>
          <select id="theme-select">
            <option value="dark" data-i18n="dark">Темна</option>
            <option value="light" data-i18n="light">Світла</option>
          </select>
        </div>
        <div class="setting-item">
          <label data-i18n="lang_label">Мова:</label>
          <select id="lang-select">
            <option value="uk" data-i18n="uk_lang">Українська</option>
            <option value="en" data-i18n="en_lang">English</option>
          </select>
        </div>
      </div>

      <form id="formcard">
        <h1 data-i18n="title">Реєстраційна форма</h1>
        <p data-i18n="desc">Приклад сучасної HTML форми з різними елементами</p>

        <div class="grid">
          <div class="field">
            <label data-i18n="fname">Ім'я</label>
            <input type="text" name="name" data-i18n-ph="fname_ph" placeholder="Введіть ім'я" />
          </div>

          <div class="field">
            <label data-i18n="lname">Прізвище</label>
            <input type="text" name="surname" data-i18n-ph="lname_ph" placeholder="Введіть прізвище" />
          </div>

          <div class="field">
            <label data-i18n="email">Email</label>
            <input type="email" name="email" data-i18n-ph="email_ph" placeholder="example@gmail.com" />
          </div>

          <div class="field">
            <label data-i18n="pwd">Пароль</label>
            <input type="password" name="pwd" data-i18n-ph="pwd_ph" placeholder="********" />
          </div>

          <div class="field">
            <label data-i18n="dob">Дата народження</label>
            <input type="date" name="date" />
          </div>

          <div class="field">
            <label data-i18n="phone">Телефон</label>
            <input type="tel" name="phone" data-i18n-ph="phone_ph" placeholder="+380..." />
          </div>

          <div class="field full">
            <label data-i18n="country">Країна</label>
            <select name="country">
              <option value="uk" data-i18n="c_uk">Україна</option>
              <option value="pl" data-i18n="c_pl">Польща</option>
              <option value="ge" data-i18n="c_ge">Німеччина</option>
              <option value="usa" data-i18n="c_usa">США</option>
            </select>
          </div>

          <div class="field full">
            <label data-i18n="gender">Стать</label>
            <div class="radio-group">
              <label>
                <input type="radio" checked name="gender" value="m" />
                <span data-i18n="g_m">Чоловік</span>
              </label>
              <label>
                <input type="radio" name="gender" value="w" />
                <span data-i18n="g_w">Жінка</span>
              </label>
            </div>
          </div>

          <div class="field full">
            <label data-i18n="skills">Ваші навички</label>
            <div class="checkbox-group">
              <label><input type="checkbox" checked /> HTML</label>
              <label><input type="checkbox" /> CSS</label>
              <label><input type="checkbox" /> JavaScript</label>
              <label><input type="checkbox" /> Python</label>
            </div>
          </div>

          <div class="field full">
            <label data-i18n="exp">Рівень досвіду</label>
            <input type="range" min="0" max="100" value="50" id="range" name="exp" oninput="valueText.innerText = this.value + '%'" />
            <div class="range-value" id="valueText">50%</div>
          </div>

          <div class="field full">
            <label data-i18n="file">Завантажити файл</label>
            <input type="file" />
          </div>

          <div class="field full">
            <label data-i18n="comment">Коментар</label>
            <textarea data-i18n-ph="comment_ph" placeholder="Напишіть щось..."></textarea>
          </div>

          <div class="field full">
            <label>
              <input type="checkbox" name="agree" />
              <span data-i18n="agree">Я погоджуюсь з умовами</span>
            </label>
          </div>
        </div>

        <div class="buttons">
          <button type="submit" class="submit-btn" data-i18n="submit">Відправити</button>
          <button type="reset" class="reset-btn" data-i18n="reset" onclick="setTimeout(() => valueText.innerText = '50%', 0)">Очистити</button>
        </div>
      </form>
    </div>
  </body>
</html>
