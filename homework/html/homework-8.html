<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Домашнє завдання 8 - Календар</title>
  <style>
    body {
      max-width: 600px;
      margin: 30px auto;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: inline-block;
      width: 150px;
    }
    input {
      padding: 5px;
      width: 100px;
    }
    button {
      padding: 5px 15px;
      cursor: pointer;
    }
    .calendar-container {
      margin-top: 30px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h2>Генератор календаря</h2>
  <form id="calendar-form">
    <div class="form-group">
      <label for="month-input">Місяць (1-12):</label>
      <input type="number" id="month-input" min="1" max="12" required>
    </div>
    <div class="form-group">
      <label for="year-input">Рік:</label>
      <input type="number" id="year-input" min="1900" max="2100" required>
    </div>
    <button type="submit">Створити календар</button>
  </form>

  <div id="calendar-container" class="calendar-container"></div>

  <script src="../scripts/homework-8.js"></script>
</body>
</html>
