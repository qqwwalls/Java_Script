<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 10</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        color: white;
      }

      .form-card {
        width: 100%;
        max-width: 520px;
        background: #111827;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .form-card h1 {
        margin-bottom: 10px;
        font-size: 32px;
      }

      .form-card p {
        color: #94a3b8;
        margin-bottom: 30px;
      }

      .grid {
        display: grid;
        gap: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        color: #cbd5e1;
      }

      input {
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #1e293b;
        color: white;
        outline: none;
        transition: 0.3s;
      }

      input:focus {
        box-shadow: 0 0 0 3px #3b82f6;
      }

      .error {
        box-shadow: 0 0 0 3px #ef4444 !important;
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }

      button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .submit-btn {
        background: #2563eb;
        color: white;
      }

      .submit-btn:hover {
        background: #1d4ed8;
      }

      .reset-btn {
        background: #334155;
        color: white;
      }

      .reset-btn:hover {
        background: #475569;
      }

      #form-message {
        margin-top: 20px;
        min-height: 22px;
        text-align: center;
        color: #ef4444;
        font-weight: bold;
      }

      #text {
        color: #94a3b8;
        margin-bottom: 0;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <form class="form-card" id="registration-form" name="registrationForm" novalidate>
      <h1>Реєстрація</h1>
      <p>Введіть логін та пароль</p>

      <div class="grid">
        <div class="field">
          <label for="login">Логін</label>
          <input id="login" name="login" type="text" placeholder="Ваш логін" />
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Ваш пароль"
          />
        </div>
      </div>

      <div class="buttons">
        <button type="submit" class="submit-btn">Реєстрація</button>
      </div>

      <div id="form-message"></div>
    </form>

    <section class="form-card hidden" id="welcome-card">
      <h1>Lesson 10</h1>
      <p id="text"></p>

      <div class="buttons">
        <button type="button" class="reset-btn" id="logout-button">Logout</button>
      </div>
    </section>

    <script src="scripts/lesson10.js"></script>
  </body>
</html>
