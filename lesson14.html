<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок 14</title>
  <script type="module" defer src="./dist/src/index.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-container {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .post {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }
    .post-actions button {
      margin-left: 10px;
      padding: 6px 12px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    .btn-add { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-cancel { background-color: #9e9e9e; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-edit { background-color: #2196F3; color: white; }
    .btn-delete { background-color: #f44336; color: white; }
  </style>
</head>
<body>
  <h1>Менеджер постів (ООП)</h1>

  <div class="form-container">
    <form id="post-form">
      <!-- Приховане поле для збереження ID при редагуванні -->
      <input type="hidden" id="post-id">
      
      <div class="form-group">
        <label for="post-title">Заголовок поста:</label>
        <input type="text" id="post-title" required>
      </div>
      
      <div class="form-group">
        <label for="post-views">Перегляди:</label>
        <input type="number" id="post-views" required>
      </div>

      <button type="submit" class="btn-add" id="submit-btn">Add Post</button>
      <button type="button" class="btn-cancel" id="cancel-btn" style="display: none;">Cancel</button>
    </form>
  </div>

  <div id="posts-container"></div>
</body>
</html>
