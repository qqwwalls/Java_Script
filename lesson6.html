<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 6</title>
    <style>
      .random-block {
        background-color: #fff6ec;
        box-sizing: border-box;
        margin: 40px auto;
        padding: 40px;
        text-align: center;
        width: 600px;
      }

      .random-title {
        font-size: 32px;
        margin: 0 0 40px;
      }

      #random-number {
        font-size: 64px;
        font-weight: 700;
        margin-bottom: 60px;
        min-height: 74px;
      }

      #generate-button {
        font-size: 32px;
        padding: 8px 24px;
      }
    </style>
  </head>
  <body>
    <div class="random-block">
      <p class="random-title">Random number:</p>
      <div id="random-number">0</div>
      <button id="generate-button" type="button">Generate random number</button>
    </div>

    <script src="scripts/lesson6.js"></script>
  </body>
</html>
