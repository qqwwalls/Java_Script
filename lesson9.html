<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сучасна HTML форма</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        color: white;
      }

      .form-card {
        width: 100%;
        max-width: 700px;
        background: #111827;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .form-card h1 {
        margin-bottom: 10px;
        font-size: 32px;
      }

      .form-card p {
        color: #94a3b8;
        margin-bottom: 30px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .full {
        grid-column: 1 / -1;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        color: #cbd5e1;
      }

      input,
      textarea,
      select {
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #1e293b;
        color: white;
        outline: none;
        transition: 0.3s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        box-shadow: 0 0 0 3px #3b82f6;
      }

      .error {
        box-shadow: 0 0 0 3px #ef4444 !important;
      }

      input[type="radio"].error,
      input[type="checkbox"].error {
        accent-color: #ef4444;
        outline: 2px solid #ef4444;
        outline-offset: 2px;
      }

      .radio-group.error label,
      .checkbox-group.error label {
        box-shadow: 0 0 0 2px #ef4444;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .radio-group,
      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 5px;
      }

      .radio-group label,
      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1e293b;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
      }

      .range-value {
        margin-top: 10px;
        color: #38bdf8;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }

      button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .submit-btn {
        background: #2563eb;
        color: white;
      }

      .submit-btn:hover {
        background: #1d4ed8;
      }

      .reset-btn {
        background: #334155;
        color: white;
      }

      .reset-btn:hover {
        background: #475569;
      }

      #form-message {
        margin-top: 20px;
        min-height: 22px;
        text-align: center;
        font-weight: bold;
      }

      #form-message.success {
        color: #22c55e;
      }

      #form-message.fail {
        color: #ef4444;
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <form class="form-card" name="formcard" novalidate>
      <h1>Реєстраційна форма</h1>
      <p>Приклад сучасної HTML форми з різними елементами</p>

      <div class="grid">
        <div class="field">
          <label>Ім'я</label>
          <input
            id="first-name"
            name="firstName"
            type="text"
            placeholder="Введіть ім'я"
          />
        </div>

        <div class="field">
          <label>Прізвище</label>
          <input
            id="last-name"
            name="lastName"
            type="text"
            placeholder="Введіть прізвище"
          />
        </div>

        <div class="field">
          <label>Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="example@gmail.com"
          />
        </div>

        <div class="field">
          <label>Пароль</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="********"
          />
        </div>

        <div class="field">
          <label>Дата народження</label>
          <input id="birthday" name="birthday" type="date" />
        </div>

        <div class="field">
          <label>Телефон</label>
          <input id="phone" name="phone" type="tel" placeholder="+380..." />
        </div>

        <div class="field full">
          <label>Країна</label>
          <select id="country" name="country">
            <option>Україна</option>
            <option>Польща</option>
            <option>Німеччина</option>
            <option>США</option>
          </select>
        </div>

        <div class="field full">
          <label>Стать</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="gender" value="Чоловік" />
              Чоловік
            </label>

            <label>
              <input type="radio" name="gender" value="Жінка" />
              Жінка
            </label>

            <label>
              <input type="radio" name="gender" value="Інше" />
              Інше
            </label>
          </div>
        </div>

        <div class="field full">
          <label>Ваші навички</label>

          <div class="checkbox-group">
            <label>
              <input type="checkbox" name="skills" value="HTML" />
              HTML
            </label>

            <label>
              <input type="checkbox" name="skills" value="CSS" />
              CSS
            </label>

            <label>
              <input type="checkbox" name="skills" value="JavaScript" />
              JavaScript
            </label>

            <label>
              <input type="checkbox" name="skills" value="Python" />
              Python
            </label>
          </div>
        </div>

        <div class="field full">
          <label>Рівень досвіду</label>

          <input
            type="range"
            min="0"
            max="100"
            value="50"
            id="range"
            name="experience"
            oninput="valueText.innerText = this.value + '%'"
          />

          <div class="range-value" id="valueText">50%</div>
        </div>

        <div class="field full">
          <label>Завантажити файл</label>
          <input name="file" type="file" />
        </div>

        <div class="field full">
          <label>Коментар</label>
          <textarea
            id="comment"
            name="comment"
            placeholder="Напишіть щось..."
          ></textarea>
        </div>

        <div class="field full">
          <label>
            <input id="agreement" name="agreement" type="checkbox" />
            Я погоджуюсь з умовами
          </label>
        </div>
      </div>

      <div class="buttons">
        <button type="submit" class="submit-btn">Відправити</button>

        <button type="reset" class="reset-btn">Очистити</button>
      </div>

      <div id="form-message"></div>
    </form>

    <script src="scripts/lesson9.js"></script>
  </body>
</html>
